<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e7d5b">
  <meta name="description" content="Spesa — gestione della spesa domestica, offline-first.">
  <title>Spesa</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">Spesa</h1>
    <div class="header-actions">
      <span id="sync-chip" class="sync-chip" aria-live="polite">Non collegato</span>
      <button id="sync-btn" class="btn-sync" type="button" aria-label="Sincronizza">Sincronizza</button>
    </div>
  </header>

  <main id="view" class="app-view"></main>

  <nav class="bottom-nav" aria-label="Navigazione principale">
    <button class="nav-btn" type="button" data-route="/spesa" aria-label="Spesa">
      <span class="nav-icon" aria-hidden="true">🛒</span>
      <span class="nav-label">Spesa</span>
    </button>
    <button class="nav-btn" type="button" data-route="/dispensa" aria-label="Dispensa">
      <span class="nav-icon" aria-hidden="true">🧺</span>
      <span class="nav-label">Dispensa</span>
    </button>
    <button class="nav-btn" type="button" data-route="/desideri" aria-label="Desideri">
      <span class="nav-icon" aria-hidden="true">⭐</span>
      <span class="nav-label">Desideri</span>
    </button>
    <button class="nav-btn" type="button" data-route="/prodotti" aria-label="Prodotti">
      <span class="nav-icon" aria-hidden="true">📋</span>
      <span class="nav-label">Prodotti</span>
    </button>
  </nav>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
